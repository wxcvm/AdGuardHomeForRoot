# ==============================================================
# AdGuardHome For Root — 模块配置文件
# ==============================================================
# 修改后执行 /data/adb/agh/scripts/tool.sh restart 生效
# ==============================================================

# ----------------------------------------------------------
# 1. DNS 监听模式
#    local_only — 仅本机 (127.0.0.1) ，其他设备不可用
#    lan_only   — 局域网 DNS 模式 (0.0.0.0:53)，Web面板仅本机
#    lan_both   — 混合模式，DNS + Web 面板均向局域网开放
# ----------------------------------------------------------
listen_mode="local_only"

# ----------------------------------------------------------
# 2. 代理自动检测与适配
#    true  — 启动时自动检测 Clash/V2Ray/NekoBox 等代理，
#            存在 TUN 模式时自动关闭 iptables 劫持
#    false — 禁用自动检测，完全手动配置
#    可通过 proxy_manager.sh panel 进入交互面板查看报告
# ----------------------------------------------------------
auto_proxy_detect=true

# ----------------------------------------------------------
# 3. 是否启用内置 iptables DNS 重定向规则
#    true  — 劫持本机所有 DNS 请求到 AdGuardHome
#    false — 不劫持，需手动配置设备 DNS 指向 127.0.0.1:5591
# ----------------------------------------------------------
enable_iptables=true

# 4. 阻断 IPv6 DNS 请求（防止 DNS 泄露绕过过滤）
#    仅在 enable_iptables=true 时生效
block_ipv6_dns=true

# 5. DNS 重定向目标端口，请与 AdGuardHome Web 面板
#    设置 → DNS 设置 中的监听端口一致
redir_port=5591

# 6. 用户和用户组，用于 AdGuardHome 自身流量绕行
adg_user=root
adg_group=net_raw

# 7. 绕过目的地址列表，用空格分隔
#    这些地址的 DNS 请求不会被劫持
ignore_dest_list=""

# 8. 绕过源地址列表，用空格分隔
#    适用于局域网设备白名单
ignore_src_list=""

# 9. 时区配置
timezone="Asia/Shanghai"

# ==============================================================
# 以下为路径常量，请勿手动修改
# ==============================================================
readonly AGH_DIR="/data/adb/agh"
readonly BIN_DIR="$AGH_DIR/bin"
readonly SCRIPT_DIR="$AGH_DIR/scripts"
readonly PID_FILE="$AGH_DIR/bin/agh.pid"
readonly MOD_PATH="/data/adb/modules/AdGuardHome"
