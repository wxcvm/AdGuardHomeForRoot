name: Pack & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    name: Pack ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            agh_arch: linux_arm64
          - arch: armv7
            agh_arch: linux_armv7

    steps:
      - uses: actions/checkout@v4

      # 用 /latest/download/ 地址，GitHub 自动 302 跳转到最新版
      # 不需要查 API，不需要拼接版本号，最稳
      - name: Download AdGuardHome binary
        run: |
          ARCH="${{ matrix.agh_arch }}"
          URL="https://github.com/AdguardTeam/AdGuardHome/releases/latest/download/AdGuardHome_${ARCH}.tar.gz"
          echo "Fetching $URL"
          curl -v -fSL "$URL" -o agh.tar.gz 2>&1 | tail -5
          echo "--- Download result ---"
          ls -lh agh.tar.gz
          echo "--- Extracting ---"
          tar -xzf agh.tar.gz
          ls -lh AdGuardHome/AdGuardHome

      # 组装模块目录
      - name: Assemble module
        run: |
          MODULE_DIR="module"
          rm -rf "$MODULE_DIR"
          mkdir -p "$MODULE_DIR/bin"

          cp src/*.sh "$MODULE_DIR/"
          cp src/settings.conf "$MODULE_DIR/"
          cp src/module.prop "$MODULE_DIR/"
          cp -r src/META-INF "$MODULE_DIR/"
          cp -r src/scripts "$MODULE_DIR/"
          cp -r src/webroot "$MODULE_DIR/"

          [ -f src/bin/AdGuardHome.yaml ] && cp src/bin/AdGuardHome.yaml "$MODULE_DIR/bin/"
          [ -d src/bin/data ] && cp -r src/bin/data "$MODULE_DIR/bin/"

          cp AdGuardHome/AdGuardHome "$MODULE_DIR/bin/AdGuardHome"
          chmod +x "$MODULE_DIR/bin/AdGuardHome"
          echo "Module:"
          find "$MODULE_DIR" -type f | sort

      - name: Package zip
        run: |
          cd module
          zip -r "../AdGuardHomeForRoot_${{ matrix.arch }}.zip" . -x "*.DS_Store" -x "__MACOSX/*"
          cd ..
          ls -lh AdGuardHomeForRoot_${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AdGuardHomeForRoot_${{ matrix.arch }}
          path: AdGuardHomeForRoot_${{ matrix.arch }}.zip
          retention-days: 7

  release:
    name: Create Release
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AdGuardHomeForRoot_*
          merge-multiple: true
          path: release

      - run: ls -lh release/

      - name: Delete old release
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Latest Build (#${{ github.run_number }})"
          tag_name: "latest"
          body: |
            ## 🔧 AdGuardHome For Root — 自动构建

            | 架构 | 文件 |
            |------|------|
            | arm64 | AdGuardHomeForRoot_arm64.zip |
            | armv7 | AdGuardHomeForRoot_armv7.zip |

            ### 🆕 v2 更新
            - **代理感知** — 检测 Clash/V2Ray/NekoBox 等 11 种
            - **三模式** — local_only / lan_only / lan_both
            - **DNS 测速** — Ping+解析双重评测
            - **控制面板** — `proxy_manager.sh panel`
            - **功能文档** — `docs/functions.md`

            ### 📦 使用
            1. 下载对应架构 zip
            2. Magisk/KernelSU/APatch 刷入
            3. http://127.0.0.1:3000

            **构建:** #${{ github.run_number }}
          files: release/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
